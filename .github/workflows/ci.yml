name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

  supabase:
    name: Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase local
        run: supabase start
        timeout-minutes: 5

      - name: Apply migrations to clean database
        run: supabase db reset

      - name: Load test helpers
        run: |
          cat > supabase/tests/_ci_helper_set_auth_uid.sql << 'EOF'
          CREATE OR REPLACE FUNCTION public.test_set_auth_uid(p_uid UUID) RETURNS VOID LANGUAGE 'plpgsql' SECURITY DEFINER SET search_path = public, auth AS $$ BEGIN PERFORM set_config('request.jwt.claims', json_build_object('sub', p_uid)::text, true); END; $$;
          EOF
          cat > supabase/tests/_ci_helper_clear_auth.sql << 'EOF'
          CREATE OR REPLACE FUNCTION public.test_clear_auth() RETURNS VOID LANGUAGE 'plpgsql' SECURITY DEFINER SET search_path = public AS $$ BEGIN PERFORM set_config('request.jwt.claims', '{}', true); END; $$;
          EOF
          supabase db query --file supabase/tests/_ci_helper_set_auth_uid.sql
          supabase db query --file supabase/tests/_ci_helper_clear_auth.sql

      - name: Run RLS tests
        run: |
          supabase db query --file supabase/tests/test_01_anon_cannot_read_profiles.sql
          supabase db query --file supabase/tests/test_02_auth_can_read_own_profile.sql
          supabase db query --file supabase/tests/test_03_auth_cannot_read_other_profiles.sql
          supabase db query --file supabase/tests/test_04_auth_cannot_promote_to_admin.sql
          supabase db query --file supabase/tests/test_05_admin_can_read_all_profiles.sql
          supabase db query --file supabase/tests/test_06_admin_can_set_role.sql
          supabase db query --file supabase/tests/test_07_non_admin_cannot_set_role.sql
          supabase db query --file supabase/tests/test_08_anon_cannot_read_leads.sql
          supabase db query --file supabase/tests/test_09_anon_cannot_insert_leads.sql
          supabase db query --file supabase/tests/test_10_auth_cannot_read_leads.sql
          supabase db query --file supabase/tests/test_11_auth_cannot_update_leads.sql
          supabase db query --file supabase/tests/test_12_auth_cannot_delete_leads.sql
          supabase db query --file supabase/tests/test_13_projects_anon_cannot_read.sql
          supabase db query --file supabase/tests/test_14_projects_anon_cannot_insert.sql
          supabase db query --file supabase/tests/test_15_projects_auth_cannot_read.sql
          supabase db query --file supabase/tests/test_16_projects_auth_cannot_update.sql
          supabase db query --file supabase/tests/test_17_projects_auth_cannot_delete.sql
          supabase db query --file supabase/tests/test_18_project_messages_anon_cannot_read.sql
          supabase db query --file supabase/tests/test_19_project_messages_anon_cannot_insert.sql
          supabase db query --file supabase/tests/test_20_project_messages_auth_cannot_read.sql
          supabase db query --file supabase/tests/test_21_project_messages_auth_cannot_update.sql
          supabase db query --file supabase/tests/test_22_project_messages_auth_cannot_delete.sql

  test:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [quality, supabase]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Start Supabase local
        run: supabase start
        timeout-minutes: 5

      - name: Apply migrations to clean database
        run: supabase db reset

      - name: Extract Supabase credentials
        id: supabase
        run: |
          set +e
          ENV_OUTPUT=$(supabase status -o env 2>/dev/null)
          if [ -z "$ENV_OUTPUT" ]; then
            ENV_OUTPUT=$(supabase status --output env 2>/dev/null)
          fi
          set -e

          if [ -n "$ENV_OUTPUT" ]; then
            eval "$ENV_OUTPUT"
          fi

          ANON_KEY="${PUBLIC_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-}}"
          SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-}"

          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            if [ -n "$ENV_OUTPUT" ]; then
              echo "::error::Supabase status env output did not contain expected keys"
              echo "::error::Output was: $ENV_OUTPUT"
            else
              echo "::error::supabase status -o env produced no output"
            fi
            exit 1
          fi

          echo "anon_key=$ANON_KEY" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$SERVICE_ROLE_KEY" >> "$GITHUB_OUTPUT"

      - name: Create test environment file
        run: |
          cat > .dev.vars << 'EOF'
          PUBLIC_SITE_URL=http://localhost:4321
          PUBLIC_SUPABASE_URL=http://localhost:54340
          PUBLIC_SUPABASE_ANON_KEY=${{ steps.supabase.outputs.anon_key }}
          SUPABASE_URL=http://localhost:54340
          SUPABASE_SERVICE_ROLE_KEY=${{ steps.supabase.outputs.service_role_key }}
          SUPABASE_PROJECT_ID=local
          SUPABASE_MOCK_MODE=false
          RESEND_API_KEY=fake-resend-key
          RESEND_FROM_EMAIL=test@eventnexus.eu
          LEAD_NOTIFICATION_EMAIL=test@eventnexus.eu
          RESEND_WEBHOOK_SECRET=whsec_dGVzdC1zZWNyZXQtZm9yLXBsYXl3cmlnaHQ=
          TURNSTILE_SITE_KEY=fake-site-key
          TURNSTILE_SECRET_KEY=
          PUBLIC_ANALYTICS_ID=G-TEST123456
          PUBLIC_ANALYTICS_ENABLED=false
          RETENTION_LEAD_DAYS=30
          RETENTION_WEBHOOK_EVENT_DAYS=30
          RETENTION_APP_LOG_DAYS=30
          NODE_ENV=test
          EOF

      - name: Build production-like output
        run: npm run build

      - name: Run Playwright against built output
        run: npx playwright test --config=playwright.build.config.ts
