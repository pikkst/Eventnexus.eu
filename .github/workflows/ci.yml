name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

  supabase:
    name: Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase local
        run: supabase start
        timeout-minutes: 5

      - name: Apply migrations to clean database
        run: supabase db reset

      - name: Run RLS tests
        run: |
          supabase db query --file supabase/tests/test_01_anon_cannot_read_profiles.sql
          supabase db query --file supabase/tests/test_02_auth_can_read_own_profile.sql
          supabase db query --file supabase/tests/test_03_auth_cannot_read_other_profiles.sql
          supabase db query --file supabase/tests/test_04_auth_cannot_promote_to_admin.sql
          supabase db query --file supabase/tests/test_05_admin_can_read_all_profiles.sql
          supabase db query --file supabase/tests/test_06_admin_can_set_role.sql
          supabase db query --file supabase/tests/test_07_non_admin_cannot_set_role.sql
          supabase db query --file supabase/tests/test_08_anon_cannot_read_leads.sql
          supabase db query --file supabase/tests/test_09_anon_cannot_insert_leads.sql
          supabase db query --file supabase/tests/test_10_auth_cannot_read_leads.sql
          supabase db query --file supabase/tests/test_11_auth_cannot_update_leads.sql
          supabase db query --file supabase/tests/test_12_auth_cannot_delete_leads.sql

  test:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [quality, supabase]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production-like output
        run: npm run build

      - name: Create test environment file
        run: |
          cat > .dev.vars << 'EOF'
          PUBLIC_SITE_URL=http://localhost:4321
          PUBLIC_SUPABASE_URL=http://localhost:54321
          PUBLIC_SUPABASE_ANON_KEY=fake-anon-key
          SUPABASE_URL=http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY=fake-service-role-key
          SUPABASE_PROJECT_ID=fake-project-id
          SUPABASE_MOCK_MODE=true
          RESEND_API_KEY=fake-resend-key
          RESEND_FROM_EMAIL=test@eventnexus.eu
          LEAD_NOTIFICATION_EMAIL=test@eventnexus.eu
          RESEND_WEBHOOK_SECRET=whsec_dGVzdC1zZWNyZXQtZm9yLXBsYXl3cmlnaHQ=
          TURNSTILE_SITE_KEY=fake-site-key
          TURNSTILE_SECRET_KEY=
          PUBLIC_ANALYTICS_ID=G-TEST123456
          PUBLIC_ANALYTICS_ENABLED=false
          RETENTION_LEAD_DAYS=30
          RETENTION_WEBHOOK_EVENT_DAYS=30
          RETENTION_APP_LOG_DAYS=30
          NODE_ENV=test
          EOF

      - name: Run Playwright against built output
        run: npx playwright test --config=playwright.build.config.ts
